<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel Flash</title>

<link rel="stylesheet" href="admin.css">

</head>

<body>

<style>
[hidden] { display: none !important; }
#loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #f5f7fb;
}
.login-card {
    width: min(420px, 100%);
    background: #fff;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.10);
    box-sizing: border-box;
}
.login-card h1 { margin: 0 0 8px; }
.login-card p { margin: 0 0 22px; color: #666; }
.login-card label { display: block; margin: 14px 0 7px; font-weight: 600; }
.login-card input { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #d1d5db; border-radius: 10px; font-size: 16px; }
.login-card button { width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 10px; background: #111827; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
#loginError { min-height: 20px; margin-top: 12px; color: #dc2626; font-weight: 600; }
#usuarioConectado { margin-left: 10px; color: #666; font-size: 13px; }
#btnCerrarSesion { margin-left: 8px; padding: 8px 12px; border: 0; border-radius: 9px; cursor: pointer; background: #eee; }
</style>

<div id="loginScreen">
    <div class="login-card">
        <h1>🔐 Panel Flash</h1>
        <p>Inicia sesión para administrar tus ofertas.</p>
        <form id="loginForm">
            <label for="loginEmail">📧 Email</label>
            <input type="email" id="loginEmail" autocomplete="username" required>

            <label for="loginPassword">🔒 Contraseña</label>
            <input type="password" id="loginPassword" autocomplete="current-password" required>

            <button type="submit">⚡ ENTRAR</button>
            <div id="loginError" role="alert"></div>
        </form>
    </div>
</div>

<div class="panel" id="panelFlash" hidden>

    <!-- IZQUIERDA -->
    <div>

        <h1>⚡ Panel Flash</h1>

        <p>Publica nuevas ofertas en segundos.</p>
        <div><span id="usuarioConectado"></span><button type="button" id="btnCerrarSesion">Cerrar sesión</button></div>

    <button type="button" id="btnNuevaOferta" class="btnNuevaOferta">
    ⚡ Nueva Oferta
    </button>


        <form id="formOferta">

            <label>📝 Nombre del producto</label>
            <input type="text" id="nombre">

           
            <div class="fila">

    <div class="campo">

        <label>💲 Precio</label>
        <input type="text" id="precio">

    </div>

    <div class="campo">

        <label>💸 Precio anterior</label>
        <input type="text" id="antes">

    </div>

</div>

        <label>🔗 Enlace de Afiliado</label>
        <input type="text" id="enlace" placeholder="Pega aquí tu enlace de afiliado">

            <div class="fila">

    <div class="campo">

        <label>🖼 Nombre de la imagen</label>

<div id="zonaImagen" class="zonaImagen">

    <input
        id="imagen"
        type="text"
        placeholder="producto.jpg">

    <input
        type="file"
        id="selectorImagen"
        accept="image/*"
        hidden>

    <small>📂 Elegir imagen</small>

</div>

    </div>

    <div class="campo">

    <label>🏷 Tipo de descuento</label>

    <select id="tipoDescuento">
        <option value="precio">💰 BAJO PRECIO</option>
        <option value="cupon">🎟 Cupón de Amazon</option>
        <option value="codigo">📋 Código promocional</option>
    </select>

    <div id="contenedorCodigo">

    <label style="margin-top:15px;">
        🏷 Código de descuento (opcional)
    </label>

    <input
        type="text"
        id="codigo"
        placeholder="Ejemplo: SAVE20">

</div>

    <label style="margin-top:15px;">
        🟢 Estado
    </label>

    <select id="estado">
        <option value="activa">🟢 Activa</option>
        <option value="oculta">🔴 Oculta</option>
    </select>

</div>

</div>

<button type="submit">
    🚀 PUBLICAR OFERTA
</button>


<label>📅 Fecha de expiración</label>
<input type="date" id="fechaExpiracion">

<div class="botones-expiracion">

    <button type="button" id="btnManana" onclick="venceManana()">
        ⚡ Mañana
    </button>

    <button type="button" id="btn4Dias" onclick="vence4Dias()">
    📅 4 días
    </button>

</div>

        </form>

        <div class="herramientas">

    <h2>📦 Ofertas Publicadas</h2>

    <input
        type="text"
        id="buscarOferta"
        placeholder="🔍 Buscar producto...">

   <div class="acciones">

    <button id="btnEliminarSeleccionadas" class="btnEliminar">
        🗑️ Eliminar seleccionadas
    </button>

</div>

<div class="tablaResponsive">

<div class="tabla-container">

<table id="tablaOfertas">

    <thead>

        <tr>

            <th width="40">
                <input type="checkbox" id="seleccionarTodo">
            </th>

            <th width="80">🖼</th>

            <th>Producto</th>

            <th width="90">💲</th>

            <th width="80">👆</th>

            <th width="160">Acciones</th>

        </tr>

    </thead>

    <tbody>

    </tbody>

</table>

</div>
    
    <div class="paginacion">

    <button id="btnAnterior" disabled>
        ◀ Anterior
    </button>

    <span id="infoPagina">
        Página 1
    </span>

    <button id="btnSiguiente">
        Siguiente ▶
    </button>

</div>

</div>

    </div>

    <!-- DERECHA -->

</div>
    

<script type="module" src="admin.js"></script>

</body>

</html>

name: Cleanup old images

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete images older than 4 days
        run: |
          now=$(date +%s)

          find images -type f | while read file; do
            last_commit=$(git log -1 --format=%ct -- "$file")

            if [ -n "$last_commit" ]; then
              age_days=$(( (now - last_commit) / 86400 ))

              if [ "$age_days" -ge 4 ]; then
                echo "Deleting $file ($age_days days old)"
                rm "$file"
              fi
            fi
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add images
            git commit -m "🗑️ Delete images older than 4 days"
            git push
          fi
